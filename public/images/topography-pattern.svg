<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
    <defs>
        <style>
            .topo-line {
                fill: none;
                stroke: #6366f1;
                stroke-width: 1.2;
                stroke-opacity: 0.08;
                stroke-linecap: round;
                stroke-linejoin: round;
            }
            .topo-line-accent {
                fill: none;
                stroke: #0048fa;
                stroke-width: 1.2;
                stroke-opacity: 0.06;
                stroke-linecap: round;
                stroke-linejoin: round;
            }
        </style>
    </defs>
    
    <!-- Topographic Contour Map Lines (Seamless Pattern) -->
